              &lt;/div&gt;
            &lt;/div&gt;
          `;
        }

        // ============================================================
        //  REFERRAL — with custom code management
        // ============================================================
        function renderReferral() {
            if (!state.currentUser) return renderLogin();
            const u = state.currentUser;

            const hasCustomCode = !!u.customReferralCode;
            const referralCode = u.customReferralCode || u.referralCode;

            const referrals = u.referrals || [];
            const pending = referrals.filter(r =&gt; r.status === &#39;pending&#39;);
            const active = referrals.filter(r =&gt; r.status === &#39;active&#39;);

            return `
            &lt;div class=&#34;fade-in&#34; style=&#34;max-width:650px;margin:20px auto;&#34;&gt;
              &lt;div class=&#34;card card-gold&#34;&gt;
                &lt;div class=&#34;page-header&#34; style=&#34;margin-bottom:12px;&#34;&gt;
                  &lt;button class=&#34;back-btn&#34; data-view=&#34;dashboard&#34;&gt;&lt;i class=&#34;fas fa-arrow-left&#34;&gt;&lt;/i&gt; Back&lt;/button&gt;
                  &lt;h2 style=&#34;font-size:20px;margin:0;&#34;&gt;&lt;i class=&#34;fas fa-users text-gold&#34;&gt;&lt;/i&gt; Referral Center&lt;/h2&gt;
                &lt;/div&gt;
                &lt;p style=&#34;color:var(--text-secondary);font-size:14px;margin-bottom:16px;&#34;&gt;Share your custom code and earn &lt;strong class=&#34;text-gold&#34;&gt;₦${CONFIG.REFERRAL_BONUS_AMOUNT}&lt;/strong&gt; when they deposit. You need an active referral to withdraw.&lt;/p&gt;

                ${!hasCustomCode ? `
                  &lt;div style=&#34;background:var(--bg-primary);border-radius:var(--radius-sm);padding:16px;margin-bottom:16px;border:1px solid var(--gold);&#34;&gt;
                    &lt;h4 style=&#34;font-size:15px;margin-bottom:8px;&#34;&gt;&lt;i class=&#34;fas fa-pen text-gold&#34;&gt;&lt;/i&gt; Set Your Custom Referral Code&lt;/h4&gt;
                    &lt;p style=&#34;font-size:13px;color:var(--text-muted);margin-bottom:10px;&#34;&gt;Choose a unique code (letters &amp; numbers, min 3 chars).&lt;/p&gt;
                    &lt;form id=&#34;setReferralCodeForm&#34; style=&#34;display:flex;gap:10px;flex-wrap:wrap;&#34;&gt;
                      &lt;input type=&#34;text&#34; id=&#34;newReferralCode&#34; placeholder=&#34;e.g. SVGE10&#34; style=&#34;flex:1;min-width:150px;padding:10px 14px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);&#34; /&gt;
                      &lt;button type=&#34;submit&#34; class=&#34;btn btn-gold btn-sm&#34;&gt;Set Code&lt;/button&gt;
                    &lt;/form&gt;
                    &lt;p style=&#34;font-size:11px;color:var(--text-muted);margin-top:6px;&#34;&gt;⚠️ Once set, this code cannot be changed.&lt;/p&gt;
                  &lt;/div&gt;
                ` : `
                  &lt;div class=&#34;referral-box&#34; style=&#34;margin-bottom:16px;border-color:var(--gold);&#34;&gt;
                    &lt;span class=&#34;code&#34;&gt;${referralCode}&lt;/span&gt;
                    &lt;div style=&#34;display:flex;gap:8px;flex-wrap:wrap;&#34;&gt;
                      &lt;button class=&#34;copy-btn&#34; id=&#34;copyReferralBtn&#34;&gt;&lt;i class=&#34;fas fa-copy&#34;&gt;&lt;/i&gt; Copy Code&lt;/button&gt;
                      &lt;button class=&#34;copy-btn&#34; id=&#34;copyReferralLinkBtn&#34;&gt;&lt;i class=&#34;fas fa-link&#34;&gt;&lt;/i&gt; Copy Link&lt;/button&gt;
                      &lt;button class=&#34;share-btn&#34; id=&#34;shareReferralBtn&#34;&gt;&lt;i class=&#34;fas fa-share-alt&#34;&gt;&lt;/i&gt; Share&lt;/button&gt;
                    &lt;/div&gt;
                  &lt;/div&gt;
                  &lt;div style=&#34;font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:12px;&#34;&gt;
                    &lt;i class=&#34;fas fa-check-circle&#34; style=&#34;color:#27ae60;&#34;&gt;&lt;/i&gt; Your custom referral code is active.
                  &lt;/div&gt;
                `}

                &lt;div style=&#34;display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;&#34;&gt;
                  &lt;span&gt;&lt;strong&gt;Total referrals:&lt;/strong&gt; ${referrals.length}&lt;/span&gt;
                  &lt;span&gt;&lt;strong&gt;Pending:&lt;/strong&gt; ${pending.length}&lt;/span&gt;
                  &lt;span&gt;&lt;strong&gt;Active:&lt;/strong&gt; ${active.length}&lt;/span&gt;
                  &lt;span&gt;&lt;strong&gt;Bonus earned:&lt;/strong&gt; ${formatCurrency(u.referralBonus || 0)}&lt;/span&gt;
                &lt;/div&gt;

                &lt;h4 style=&#34;font-size:16px;margin-bottom:10px;&#34;&gt;Your Referrals&lt;/h4&gt;
                ${referrals.length === 0 ? `
                  &lt;div class=&#34;card&#34; style=&#34;text-align:center;padding:20px;color:var(--text-muted);&#34;&gt;
                    &lt;i class=&#34;fas fa-user-plus&#34; style=&#34;font-size:28px;opacity:0.3;margin-bottom:8px;&#34;&gt;&lt;/i&gt;
                    &lt;p&gt;No referrals yet. Share your code!&lt;/p&gt;
                  &lt;/div&gt;
                ` : `
                  ${referrals.map(ref =&gt; {
                    const referredUser = findUserById(ref.userId);
                    return `
                      &lt;div class=&#34;referral-item&#34;&gt;
                        &lt;span&gt;${referredUser ? referredUser.fullName : &#39;Unknown&#39;}&lt;/span&gt;
                        &lt;span&gt;
                          &lt;span class=&#34;status-badge ${ref.status}&#34;&gt;${ref.status}&lt;/span&gt;
                          ${ref.status === &#39;active&#39; ? `&lt;i class=&#34;fas fa-check-circle&#34; style=&#34;color:#27ae60;margin-left:6px;&#34;&gt;&lt;/i&gt;` : `&lt;i class=&#34;fas fa-clock&#34; style=&#34;color:#f39c12;margin-left:6px;&#34;&gt;&lt;/i&gt;`}
                        &lt;/span&gt;
                      &lt;/div&gt;
                    `;
                  }).join(&#39;&#39;)}
                `}
              &lt;/div&gt;
            &lt;/div&gt;
          `;
        }

        // ============================================================
        //  NAVIGATION
        // ============================================================
        function updateNav() {
            const isLoggedIn = !!state.currentUser;
            document.getElementById(&#39;authLinks&#39;).style.display = isLoggedIn ? &#39;none&#39; : &#39;flex&#39;;
            document.getElementById(&#39;userBadge&#39;).style.display = isLoggedIn ? &#39;flex&#39; : &#39;none&#39;;
            document.getElementById(&#39;logoutNavBtn&#39;).style.display = isLoggedIn ? &#39;inline-block&#39; : &#39;none&#39;;
            document.getElementById(&#39;navDashboard&#39;).style.display = isLoggedIn ? &#39;inline-block&#39; : &#39;none&#39;;
            document.getElementById(&#39;navPlans&#39;).style.display = &#39;inline-block&#39;;
            document.getElementById(&#39;navDeposit&#39;).style.display = isLoggedIn ? &#39;inline-block&#39; : &#39;none&#39;;
            document.getElementById(&#39;navWithdraw&#39;).style.display = isLoggedIn ? &#39;inline-block&#39; : &#39;none&#39;;
            document.getElementById(&#39;navInvest&#39;).style.display = isLoggedIn ? &#39;inline-block&#39; : &#39;none&#39;;
            document.getElementById(&#39;navReferral&#39;).style.display = isLoggedIn ? &#39;inline-block&#39; : &#39;none&#39;;

            if (isLoggedIn &amp;&amp; state.currentUser) {
                document.getElementById(&#39;userAvatar&#39;).textContent = getInitials(state.currentUser.fullName);
                document.getElementById(&#39;userNameShort&#39;).textContent = state.currentUser.fullName.split(&#39; &#39;)[0];
            }
        }

        // ============================================================
        //  EVENT BINDING
        // ============================================================
        function bindEvents(view) {
            // Nav clicks
            document.querySelectorAll(&#39;[data-view]&#39;).forEach(el =&gt; {
                el.addEventListener(&#39;click&#39;, (e) =&gt; {
                    e.preventDefault();
                    const viewName = el.dataset.view;
                    if (viewName === &#39;logout&#39;) {
                        handleLogout();
                        return;
                    }
                    if (viewName === &#39;dashboard&#39; &amp;&amp; !state.currentUser) {
                        showToast(&#39;Please login first&#39;, &#39;warning&#39;);
                        renderView(&#39;login&#39;);
                        return;
                    }
                    if ((viewName === &#39;deposit&#39; || viewName === &#39;withdraw&#39; || viewName === &#39;invest&#39; || viewName ===
                            &#39;referral&#39;) &amp;&amp; !state.currentUser) {
                        showToast(&#39;Please login first&#39;, &#39;warning&#39;);
                        renderView(&#39;login&#39;);
                        return;
                    }
                    if (viewName === &#39;invest&#39; &amp;&amp; el.dataset.plan) {
                        const url = new URL(window.location);
                        url.searchParams.set(&#39;plan&#39;, el.dataset.plan);
                        window.history.pushState({}, &#39;&#39;, url);
                        renderView(&#39;invest&#39;);
                        return;
                    }
                    renderView(viewName);
                    document.getElementById(&#39;navLinks&#39;).classList.remove(&#39;open&#39;);
                });
            });

            // Mobile toggle
            document.getElementById(&#39;mobileToggle&#39;).addEventListener(&#39;click&#39;, () =&gt; {
                document.getElementById(&#39;navLinks&#39;).classList.toggle(&#39;open&#39;);
            });

            // Logout via nav button
            document.getElementById(&#39;logoutNavBtn&#39;).addEventListener(&#39;click&#39;, (e) =&gt; {
                e.preventDefault();
                handleLogout();
            });

            // Logout via dashboard button
            document.getElementById(&#39;logoutDashBtn&#39;)?.addEventListener(&#39;click&#39;, (e) =&gt; {
                e.preventDefault();
                handleLogout();
            });

            // Theme
            document.getElementById(&#39;themeToggle&#39;).addEventListener(&#39;click&#39;, toggleTheme);

            // Admin
            document.getElementById(&#39;adminToggle&#39;).addEventListener(&#39;click&#39;, toggleAdminPanel);
            document.getElementById(&#39;adminPanelClose&#39;).addEventListener(&#39;click&#39;, closeAdminPanel);
            document.getElementById(&#39;adminOverlay&#39;).addEventListener(&#39;click&#39;, closeAdminPanel);

            document.getElementById(&#39;adminAuthBtn&#39;)?.addEventListener(&#39;click&#39;, () =&gt; {
                const pw = document.getElementById(&#39;adminPasswordInput&#39;).value;
                if (pw === CONFIG.ADMIN_PASSWORD) {
                    state.adminAuthenticated = true;
                    renderAdminContent();
                    showToast(&#39;Admin access granted&#39;, &#39;success&#39;);
                } else {
                    showToast(&#39;Incorrect password&#39;, &#39;error&#39;);
                }
            });
            document.getElementById(&#39;adminPasswordInput&#39;)?.addEventListener(&#39;keydown&#39;, (e) =&gt; {
                if (e.key === &#39;Enter&#39;) document.getElementById(&#39;adminAuthBtn&#39;).click();
            });

            // Copy account
            document.getElementById(&#39;copyAccountBtn&#39;)?.addEventListener(&#39;click&#39;, () =&gt; {
                navigator.clipboard.writeText(CONFIG.BANK_ACCOUNT).then(() =&gt; {
                    showToast(&#39;Account number copied!&#39;, &#39;success&#39;);
                }).catch(() =&gt; {
                    const ta = document.createElement(&#39;textarea&#39;);
                    ta.value = CONFIG.BANK_ACCOUNT;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand(&#39;copy&#39;);
                    ta.remove();
                    showToast(&#39;Account number copied!&#39;, &#39;success&#39;);
                });
            });

            // Copy referral &amp; share buttons (delegated)
            document.querySelectorAll(&#39;#copyReferralBtn, #copyReferralLinkBtn, #shareReferralBtn&#39;).forEach(btn =&gt; {
                btn.addEventListener(&#39;click&#39;, function(e) {
                    e.stopPropagation();
                    const id = this.id;
                    if (id === &#39;shareReferralBtn&#39;) {
                        shareReferral();
                        return;
                    }
                    const code = state.currentUser?.customReferralCode || state.currentUser?.referralCode ||
                        &#39;&#39;;
                    if (id === &#39;copyReferralLinkBtn&#39;) {
                        const link =
                            `${window.location.origin}${window.location.pathname}?ref=${code}`;
                        navigator.clipboard.writeText(link).then(() =&gt; {
                            showToast(&#39;Referral link copied!&#39;, &#39;success&#39;);
                        }).catch(() =&gt; {
                            const ta = document.createElement(&#39;textarea&#39;);
                            ta.value = link;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand(&#39;copy&#39;);
                            ta.remove();
                            showToast(&#39;Referral link copied!&#39;, &#39;success&#39;);
                        });
                    } else {
                        navigator.clipboard.writeText(code).then(() =&gt; {
                            showToast(&#39;Referral code copied!&#39;, &#39;success&#39;);
                        }).catch(() =&gt; {
                            const ta = document.createElement(&#39;textarea&#39;);
                            ta.value = code;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand(&#39;copy&#39;);
                            ta.remove();
                            showToast(&#39;Referral code copied!&#39;, &#39;success&#39;);
                        });
                    }
                });
            });

            // Set custom referral code
            document.getElementById(&#39;setReferralCodeForm&#39;)?.addEventListener(&#39;submit&#39;, async (e) =&gt; {
                e.preventDefault();
                const input = document.getElementById(&#39;newReferralCode&#39;);
                const code = input.value.trim().toUpperCase();
                const btn = e.target.querySelector(&#39;button[type=&#34;submit&#34;]&#39;);
                btn.disabled = true;
                btn.innerHTML = &#39;&lt;span class=&#34;loader&#34;&gt;&lt;/span&gt;&#39;;
                try {
                    await setCustomReferralCode(state.currentUser.id, code);
                    const updatedUser = findUserById(state.currentUser.id);
                    state.currentUser = updatedUser;
                    saveSession(updatedUser);
                    showToast(&#39;Referral code set successfully!&#39;, &#39;success&#39;);
                    renderView(&#39;referral&#39;);
                } catch (err) {
                    showToast(err.message, &#39;error&#39;);
                }
                btn.disabled = false;
                btn.innerHTML = &#39;Set Code&#39;;
            });

            // Login
            document.getElementById(&#39;loginForm&#39;)?.addEventListener(&#39;submit&#39;, async (e) =&gt; {
                e.preventDefault();
                const email = document.getElementById(&#39;loginEmail&#39;).value.trim();
                const password = document.getElementById(&#39;loginPassword&#39;).value;
                const btn = document.getElementById(&#39;loginBtn&#39;);
                btn.disabled = true;
                btn.innerHTML = &#39;&lt;span class=&#34;loader&#34;&gt;&lt;/span&gt; Signing in...&#39;;
                try {
                    const user = await loginUser(email, password);
                    state.currentUser = user;
                    saveSession(user);
                    showToast(`Welcome back, ${user.fullName}!`, &#39;success&#39;);
                    renderView(&#39;dashboard&#39;);
                } catch (err) {
                    showToast(err.message, &#39;error&#39;);
                }
                btn.disabled = false;
                btn.innerHTML = &#39;Sign In&#39;;
            });

            // Register — with custom code handling
            document.getElementById(&#39;registerForm&#39;)?.addEventListener(&#39;submit&#39;, async (e) =&gt; {
                e.preventDefault();
                const name = document.getElementById(&#39;regName&#39;).value.trim();
                const email = document.getElementById(&#39;regEmail&#39;).value.trim();
                const phone = document.getElementById(&#39;regPhone&#39;).value.trim();
                const password = document.getElementById(&#39;regPassword&#39;).value;
                const customCode = document.getElementById(&#39;regCustomCode&#39;).value.trim();
                const referrerCode = document.getElementById(&#39;regReferral&#39;).value.trim().toUpperCase();
                const btn = document.getElementById(&#39;registerBtn&#39;);
                btn.disabled = true;
                btn.innerHTML = &#39;&lt;span class=&#34;loader&#34;&gt;&lt;/span&gt; Creating account...&#39;;
                try {
                    const user = await registerUser(name, email, phone, password, customCode, referrerCode);
                    state.currentUser = user;
                    saveSession(user);
                    showToast(`Account created! Welcome ${user.fullName}`, &#39;success&#39;);
                    renderView(&#39;dashboard&#39;);
                } catch (err) {
                    showToast(err.message, &#39;error&#39;);
                }
                btn.disabled = false;
                btn.innerHTML = &#39;Create Account&#39;;
            });

            // Deposit
            document.getElementById(&#39;depositForm&#39;)?.addEventListener(&#39;submit&#39;, async (e) =&gt; {
                e.preventDefault();
                const amountInput = document.getElementById(&#39;depositAmount&#39;);
                const amount = parseFloat(amountInput.value);
                const bankName = document.getElementById(&#39;depositBankName&#39;).value.trim();
                const accountNumber = document.getElementById(&#39;depositAccountNumber&#39;).value.trim();
                const accountName = document.getElementById(&#39;depositAccountName&#39;).value.trim();
                const file = document.getElementById(&#39;receiptFile&#39;).files[0];
                const btn = document.getElementById(&#39;depositBtn&#39;);
                btn.disabled = true;
                btn.innerHTML = &#39;&lt;span class=&#34;loader&#34;&gt;&lt;/span&gt; Submitting...&#39;;

                try {
                    if (!state.currentUser) throw new Error(&#39;Please login first&#39;);
                    if (!amount || isNaN(amount) || amount &lt; 100) throw new Error(&#39;Minimum deposit is ₦100&#39;);
                    if (!bankName || !accountNumber || !accountName) throw new Error(&#39;Please fill all bank details&#39;);

                    let receiptBase64 = &#39;&#39;;
                    if (file) {
                        receiptBase64 = await fileToBase64(file);
                    }

                    await createDeposit(state.currentUser.id, amount, bankName, accountNumber, accountName,
                    receiptBase64);
                    showToast(`Deposit of ${formatCurrency(amount)} submitted for verification!`, &#39;success&#39;);
                    renderView(&#39;dashboard&#39;);
                } catch (err) {
                    showToast(err.message || &#39;Deposit submission failed&#39;, &#39;error&#39;);
                }
                btn.disabled = false;
                btn.innerHTML = &#39;Submit Deposit&#39;;
            });

            // File input preview
            const fileInput = document.getElementById(&#39;receiptFile&#39;);
            const fileName = document.getElementById(&#39;receiptFileName&#39;);
            if (fileInput &amp;&amp; fileName) {
                fileInput.addEventListener(&#39;change&#39;, () =&gt; {
                    fileName.textContent = fileInput.files.length &gt; 0 ? fileInput.files[0].name : &#39;No file selected&#39;;
                });
            }

            // Withdraw
            document.getElementById(&#39;withdrawForm&#39;)?.addEventListener(&#39;submit&#39;, async (e) =&gt; {
                e.preventDefault();
                const amount = parseFloat(document.getElementById(&#39;withdrawAmount&#39;).value);
                const bankName = document.getElementById(&#39;withdrawBank&#39;).value.trim();
                const accountNumber = document.getElementById(&#39;withdrawAccount&#39;).value.trim();
                const accountName = document.getElementById(&#39;withdrawAccountName&#39;).value.trim();
                const btn = document.getElementById(&#39;withdrawBtn&#39;);
                btn.disabled = true;
                btn.innerHTML = &#39;&lt;span class=&#34;loader&#34;&gt;&lt;/span&gt; Submitting...&#39;;

                try {
                    if (!state.currentUser) throw new Error(&#39;Please login first&#39;);
                    if (!amount || isNaN(amount) || amount &lt; 100) throw new Error(&#39;Minimum withdrawal is ₦100&#39;);
                    if (amount &gt; CONFIG.WITHDRAW_LIMIT) throw new Error(
                        `Maximum withdrawal is ${formatCurrency(CONFIG.WITHDRAW_LIMIT)}`);
                    if (!bankName || !accountNumber || !accountName) throw new Error(&#39;Please fill all bank details&#39;);

                    await createWithdrawal(state.currentUser.id, amount, bankName, accountNumber, accountName);
                    showToast(`Withdrawal of ${formatCurrency(amount)} submitted!`, &#39;success&#39;);
                    renderView(&#39;dashboard&#39;);
                } catch (err) {
                    showToast(err.message, &#39;error&#39;);
                }
                btn.disabled = false;
                btn.innerHTML = &#39;Request Withdrawal&#39;;
            });

            // Invest
            const investForm = document.getElementById(&#39;investForm&#39;);
            if (investForm) {
                const planSelect = document.getElementById(&#39;investPlan&#39;);

                function updateInvestDisplay() {
                    const planId = planSelect.value;
                    const plan = PLANS.find(p =&gt; p.id === planId);
                    if (plan) {
                        document.getElementById(&#39;investDisplayAmount&#39;).textContent = formatCurrency(plan.amount);
                        document.getElementById(&#39;investDisplayRate&#39;).textContent = plan.rate + &#39;%&#39;;
                        document.getElementById(&#39;investDisplayReturn&#39;).textContent = formatCurrency(plan.amount * plan
                            .rate / 100);
                        document.getElementById(&#39;investBtn&#39;).innerHTML =
                            `&lt;i class=&#34;fas fa-rocket&#34;&gt;&lt;/i&gt; Invest ${formatCurrency(plan.amount)}`;
                    }
                }

                planSelect.addEventListener(&#39;change&#39;, updateInvestDisplay);
                setTimeout(updateInvestDisplay, 100);

                investForm.addEventListener(&#39;submit&#39;, async (e) =&gt; {
                    e.preventDefault();
                    const planId = document.getElementById(&#39;investPlan&#39;).value;
                    const btn = document.getElementById(&#39;investBtn&#39;);
                    btn.disabled = true;
                    btn.innerHTML = &#39;&lt;span class=&#34;loader&#34;&gt;&lt;/span&gt; Processing...&#39;;

                    try {
                        if (!state.currentUser) throw new Error(&#39;Please login first&#39;);
                        const plan = PLANS.find(p =&gt; p.id === planId);
                        if (!plan) throw new Error(&#39;Invalid plan&#39;);

                        await createInvestment(state.currentUser.id, planId);
                        showToast(`Investment of ${formatCurrency(plan.amount)} activated!`, &#39;success&#39;);
                        renderView(&#39;dashboard&#39;);
                    } catch (err) {
                        showToast(err.message, &#39;error&#39;);
                    }
                    btn.disabled = false;
                    const plan = PLANS.find(p =&gt; p.id === planId);
                    btn.innerHTML = plan ? `&lt;i class=&#34;fas fa-rocket&#34;&gt;&lt;/i&gt; Invest ${formatCurrency(plan.amount)}` :
                        &#39;Invest&#39;;
                });
            }
        }

        // ============================================================
        //  ADMIN PANEL
        // ============================================================
        function toggleAdminPanel() {
            const panel = document.getElementById(&#39;adminPanel&#39;);
            const overlay = document.getElementById(&#39;adminOverlay&#39;);
            const isOpen = panel.classList.contains(&#39;open&#39;);
            if (isOpen) {
                closeAdminPanel();
            } else {
                state.adminAuthenticated = false;
                document.getElementById(&#39;adminPasswordInput&#39;).value = &#39;&#39;;
                openAdminPanel();
            }
        }

        function openAdminPanel() {
            const panel = document.getElementById(&#39;adminPanel&#39;);
            const overlay = document.getElementById(&#39;adminOverlay&#39;);
            panel.classList.add(&#39;open&#39;);
            overlay.classList.add(&#39;open&#39;);

            if (state.adminAuthenticated) {
                renderAdminContent();
            } else {
                const container = document.getElementById(&#39;adminContent&#39;);
                container.innerHTML = `
                  &lt;div class=&#34;empty-state&#34;&gt;
                    &lt;i class=&#34;fas fa-lock&#34;&gt;&lt;/i&gt;
                    &lt;p&gt;Enter admin password to continue&lt;/p&gt;
                    &lt;div style=&#34;margin-top:12px;max-width:260px;margin-left:auto;margin-right:auto;&#34;&gt;
                      &lt;div class=&#34;form-group&#34; style=&#34;margin-bottom:10px;&#34;&gt;
                        &lt;input type=&#34;password&#34; id=&#34;adminPasswordInput&#34; placeholder=&#34;Enter password&#34; style=&#34;text-align:center;&#34; /&gt;
                      &lt;/div&gt;
                      &lt;button class=&#34;btn btn-gold btn-block btn-sm&#34; id=&#34;adminAuthBtn&#34;&gt;Unlock Panel&lt;/button&gt;
                    &lt;/div&gt;
                  &lt;/div&gt;
                `;
                document.getElementById(&#39;adminAuthBtn&#39;)?.addEventListener(&#39;click&#39;, () =&gt; {
                    const pw = document.getElementById(&#39;adminPasswordInput&#39;).value;
                    if (pw === CONFIG.ADMIN_PASSWORD) {
                        state.adminAuthenticated = true;
                        renderAdminContent();
                        showToast(&#39;Admin access granted&#39;, &#39;success&#39;);
                    } else {
                        showToast(&#39;Incorrect password&#39;, &#39;error&#39;);
                    }
                });
                document.getElementById(&#39;adminPasswordInput&#39;)?.addEventListener(&#39;keydown&#39;, (e) =&gt; {
                    if (e.key === &#39;Enter&#39;) document.getElementById(&#39;adminAuthBtn&#39;).click();
                });
            }
        }

        function closeAdminPanel() {
            const panel = document.getElementById(&#39;adminPanel&#39;);
            const overlay = document.getElementById(&#39;adminOverlay&#39;);
            panel.classList.remove(&#39;open&#39;);
            overlay.classList.remove(&#39;open&#39;);
        }

        function renderAdminContent() {
            if (!state.adminAuthenticated) return;
            const container = document.getElementById(&#39;adminContent&#39;);
            const pendingDeposits = state.deposits.filter(d =&gt; d.status === &#39;pending&#39;);

            if (pendingDeposits.length === 0) {
                container.innerHTML = `
                  &lt;div class=&#34;empty-state&#34;&gt;
                    &lt;i class=&#34;fas fa-check-circle&#34; style=&#34;color:#27ae60;&#34;&gt;&lt;/i&gt;
                    &lt;p&gt;No pending deposits to validate&lt;/p&gt;
                    &lt;span style=&#34;font-size:12px;&#34;&gt;All deposits are up to date&lt;/span&gt;
                  &lt;/div&gt;
                `;
                document.getElementById(&#39;adminBadge&#39;).style.display = &#39;none&#39;;
                return;
            }

            document.getElementById(&#39;adminBadge&#39;).style.display = &#39;block&#39;;

            container.innerHTML = `
              &lt;p style=&#34;font-size:13px;color:var(--text-muted);margin-bottom:16px;&#34;&gt;
                &lt;i class=&#34;fas fa-info-circle&#34;&gt;&lt;/i&gt; ${pendingDeposits.length} deposit(s) awaiting verification
              &lt;/p&gt;
              ${pendingDeposits.map(d =&gt; {
                const user = findUserById(d.userId);
                return `
                  &lt;div class=&#34;deposit-item&#34; data-id=&#34;${d.id}&#34;&gt;
                    &lt;div class=&#34;deposit-info&#34;&gt;
                      &lt;span class=&#34;user&#34;&gt;${user ? user.fullName : &#39;Unknown&#39;}&lt;/span&gt;
                      &lt;span class=&#34;amount&#34;&gt;${formatCurrency(d.amount)}&lt;/span&gt;
                      &lt;span class=&#34;status pending&#34;&gt;Pending&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;div style=&#34;font-size:12px;color:var(--text-muted);margin:4px 0;&#34;&gt;
                      ${formatDate(d.createdAt)}
                    &lt;/div&gt;
                    &lt;div class=&#34;bank-details-mini&#34;&gt;
                      &lt;span&gt;&lt;i class=&#34;fas fa-university&#34;&gt;&lt;/i&gt; ${d.bankName || &#39;N/A&#39;}&lt;/span&gt;
                      &lt;span&gt;&lt;i class=&#34;fas fa-hashtag&#34;&gt;&lt;/i&gt; ${d.accountNumber || &#39;N/A&#39;}&lt;/span&gt;
                      &lt;span&gt;&lt;i class=&#34;fas fa-user&#34;&gt;&lt;/i&gt; ${d.accountName || &#39;N/A&#39;}&lt;/span&gt;
                    &lt;/div&gt;
                    ${d.receipt ? `&lt;img src=&#34;${d.receipt}&#34; class=&#34;receipt-preview&#34; alt=&#34;Receipt&#34; /&gt;` : &#39;&#39;}
                    &lt;div class=&#34;deposit-actions&#34;&gt;
                      &lt;button class=&#34;btn btn-success btn-sm admin-approve&#34; data-id=&#34;${d.id}&#34;&gt;&lt;i class=&#34;fas fa-check&#34;&gt;&lt;/i&gt; Approve&lt;/button&gt;
                      &lt;button class=&#34;btn btn-danger btn-sm admin-reject&#34; data-id=&#34;${d.id}&#34;&gt;&lt;i class=&#34;fas fa-times&#34;&gt;&lt;/i&gt; Reject&lt;/button&gt;
                    &lt;/div&gt;
                  &lt;/div&gt;
                `;
              }).join(&#39;&#39;)}
            `;

            container.querySelectorAll(&#39;.admin-approve&#39;).forEach(btn =&gt; {
                btn.addEventListener(&#39;click&#39;, async () =&gt; {
                    const id = btn.dataset.id;
                    if (confirm(&#39;Approve this deposit?&#39;)) {
                        try {
                            await approveDeposit(id);
                            showToast(&#39;Deposit approved! Funds added to wallet.&#39;, &#39;success&#39;);
                            await loadAllData();
                            renderAdminContent();
                            if (state.currentUser) renderView(&#39;dashboard&#39;);
                        } catch (err) {
                            showToast(err.message, &#39;error&#39;);
                        }
                    }
                });
            });

            container.querySelectorAll(&#39;.admin-reject&#39;).forEach(btn =&gt; {
                btn.addEventListener(&#39;click&#39;, async () =&gt; {
                    const id = btn.dataset.id;
                    if (confirm(&#39;Reject this deposit?&#39;)) {
                        try {
                            await rejectDeposit(id);
                            showToast(&#39;Deposit rejected.&#39;, &#39;warning&#39;);
                            await loadAllData();
                            renderAdminContent();
                            if (state.currentUser) renderView(&#39;dashboard&#39;);
                        } catch (err) {
                            showToast(err.message, &#39;error&#39;);
                        }
                    }
                });
            });
        }

        // ============================================================
        //  LOGOUT
        // ============================================================
        function handleLogout() {
            clearSession();
            state.currentUser = null;
            state.adminAuthenticated = false;
            showToast(&#39;Logged out successfully&#39;, &#39;info&#39;);
            renderView(&#39;home&#39;);
            closeAdminPanel();
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            const theme = getPreferredTheme();
            setTheme(theme);

            try {
                await loadAllData();
                calculateReturns();

                const session = getSession();
                if (session) {
                    const user = findUserById(session.id);
                    if (user) {
                        state.currentUser = user;
                        renderView(&#39;dashboard&#39;);
                    } else {
                        clearSession();
                        renderView(&#39;home&#39;);
                    }
                } else {
                    const urlParams = new URLSearchParams(window.location.search);
                    const ref = urlParams.get(&#39;ref&#39;);
                    if (ref) {
                        renderView(&#39;register&#39;);
                        setTimeout(() =&gt; {
                            const input = document.getElementById(&#39;regReferral&#39;);
                            if (input) input.value = ref.toUpperCase();
                        }, 100);
                    } else {
                        renderView(&#39;home&#39;);
                    }
                }

                const pendingCount = state.deposits.filter(d =&gt; d.status === &#39;pending&#39;).length;
                document.getElementById(&#39;adminBadge&#39;).style.display = pendingCount &gt; 0 ? &#39;block&#39; : &#39;none&#39;;

                setInterval(async () =&gt; {
                    await loadAllData();
                    calculateReturns();
                    if (state.currentView === &#39;dashboard&#39;) renderView(&#39;dashboard&#39;);
                    if (document.getElementById(&#39;adminPanel&#39;).classList.contains(&#39;open&#39;) &amp;&amp; state.adminAuthenticated)
                        renderAdminContent();
                    const pending = state.deposits.filter(d =&gt; d.status === &#39;pending&#39;).length;
                    document.getElementById(&#39;adminBadge&#39;).style.display = pending &gt; 0 ? &#39;block&#39; : &#39;none&#39;;
                }, 30000);

            } catch (err) {
                console.error(&#39;Init error:&#39;, err);
                showToast(&#39;Error loading data. Please refresh.&#39;, &#39;error&#39;);
                renderView(&#39;home&#39;);
            }
        }

        init();
    </script>
  </body>
</html>
