<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Petroflow • Invest in Oil &amp; Gas
    </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap" rel="stylesheet" />
    <style>
      /* ---------- THEME VARIABLES ---------- */
        :root {
            --bg-primary: #0b0b1a;
            --bg-secondary: #111128;
            --bg-card: #16163a;
            --bg-card-hover: #1e1e4a;
            --gold: #d4a843;
            --gold-light: #f5d37c;
            --gold-glow: rgba(212, 168, 67, 0.25);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0c0;
            --text-muted: #6a6a8a;
            --border-color: #2a2a5a;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: &#39;Inter&#39;, -apple-system, BlinkMacSystemFont, sans-serif;
            --toast-bg: var(--bg-card);
        }

        [data-theme=&#34;light&#34;] {
            --bg-primary: #f5f5fa;
            --bg-secondary: #e8e8f0;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f8;
            --text-primary: #1a1a2e;
            --text-secondary: #3a3a5a;
            --text-muted: #7a7a9a;
            --border-color: #c0c0d0;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            --toast-bg: #ffffff;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme=&#34;dark&#34;]) {
                --bg-primary: #f5f5fa;
                --bg-secondary: #e8e8f0;
                --bg-card: #ffffff;
                --bg-card-hover: #f0f0f8;
                --text-primary: #1a1a2e;
                --text-secondary: #3a3a5a;
                --text-muted: #7a7a9a;
                --border-color: #c0c0d0;
                --shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
                --toast-bg: #ffffff;
            }
        }

        /* ---------- RESET &amp; BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        a {
            color: var(--gold);
            text-decoration: none;
        }
        button {
            font-family: var(--font);
            cursor: pointer;
            border: none;
            outline: none;
            transition: var(--transition);
        }
        input,
        select,
        textarea {
            font-family: var(--font);
            outline: none;
            border: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .flex {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flex-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }
        .text-gold {
            color: var(--gold);
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-center {
            text-align: center;
        }
        .mt-1 {
            margin-top: 10px;
        }
        .mt-2 {
            margin-top: 20px;
        }
        .mt-3 {
            margin-top: 30px;
        }
        .mt-4 {
            margin-top: 40px;
        }
        .mb-2 {
            margin-bottom: 20px;
        }
        .mb-3 {
            margin-bottom: 30px;
        }
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-gold {
            background: var(--gold);
            color: #0b0b1a;
            border: 1px solid var(--gold);
        }
        .btn-gold:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--gold-glow);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .btn-outline:hover {
            background: var(--gold);
            color: #0b0b1a;
        }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
            border: 1px solid #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-success {
            background: #27ae60;
            color: #fff;
            border: 1px solid #27ae60;
        }
        .btn-success:hover {
            background: #1e8449;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
        }
        .btn-block {
            width: 100%;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-back {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            font-size: 13px;
        }
        .btn-back:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateX(-2px);
        }

        /* ---------- CARDS ---------- */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }
        .card:hover {
            border-color: var(--gold);
            box-shadow: 0 8px 40px rgba(212, 168, 67, 0.05);
        }
        .card-gold {
            border-color: var(--gold);
            background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
        }
        .card-gold .card-title {
            color: var(--gold);
        }

        /* ---------- HEADER / NAV ---------- */
        .header {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s;
        }
        .header .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo i {
            color: var(--gold);
            font-size: 28px;
        }
        .header .logo span {
            color: var(--gold);
        }
        .header .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header .nav-links a {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }
        .header .nav-links a:hover {
            color: var(--gold);
        }
        .header .nav-links .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .header .nav-links .user-badge .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--gold);
            color: #0b0b1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }
        .header .nav-links .user-badge span {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 13px;
        }
        .mobile-toggle {
            display: none;
            font-size: 24px;
            color: var(--text-primary);
            background: none;
        }
        .theme-toggle {
            background: none;
            color: var(--text-secondary);
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle:hover {
            color: var(--gold);
            border-color: var(--gold);
        }

        /* ---------- HERO ---------- */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: &#39;&#39;;
            position: absolute;
            top: -40%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            opacity: 0.3;
            pointer-events: none;
        }
        .hero h1 {
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.1;
            position: relative;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 16px auto 30px;
        }
        .hero .support {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
        }
        .hero .support i {
            color: #25d366;
            font-size: 20px;
        }
        .hero .support a {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ---------- FORMS ---------- */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group .file-input {
            position: relative;
            padding: 30px 20px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .form-group .file-input:hover {
            border-color: var(--gold);
            background: rgba(212, 168, 67, 0.05);
        }
        .form-group .file-input input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .form-group .file-input .file-name {
            color: var(--text-primary);
            font-weight: 500;
            margin-top: 6px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ---------- DASHBOARD STATS ---------- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .stat-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
        }
        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 4px;
            letter-spacing: -0.5px;
        }
        .stat-card .stat-value.gold {
            color: var(--gold);
        }
        .stat-card .stat-icon {
            font-size: 28px;
            opacity: 0.2;
        }

        /* ---------- INVESTMENT PLANS ---------- */
        .plan-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px 24px;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .plan-card:hover {
            transform: translateY(-6px);
            border-color: var(--gold);
            box-shadow: 0 12px 50px rgba(212, 168, 67, 0.08);
        }
        .plan-card .plan-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--gold);
            color: #0b0b1a;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .plan-card .plan-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .plan-card .plan-rate {
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
            margin: 8px 0;
        }
        .plan-card .plan-rate small {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .plan-card .plan-fixed-amount {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 4px 0 8px;
        }
        .plan-card .plan-fixed-amount small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-muted);
        }
        .plan-card .plan-desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            min-height: 40px;
        }
        .plan-card .plan-features {
            list-style: none;
            text-align: left;
            margin: 12px 0 18px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .plan-card .plan-features li {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .plan-card .plan-features li i {
            color: var(--gold);
            font-size: 12px;
        }

        /* ---------- ADMIN PANEL ---------- */
        .admin-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .admin-toggle:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: scale(1.05);
        }
        .admin-toggle .badge-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: #e74c3c;
            border-radius: 50%;
            border: 2px solid var(--bg-primary);
        }

        .admin-panel {
            position: fixed;
            top: 0;
            right: -440px;
            width: 420px;
            max-width: 90vw;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            z-index: 300;
            padding: 24px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.6);
        }
        .admin-panel.open {
            right: 0;
        }
        .admin-panel .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-panel .panel-header h3 {
            font-size: 20px;
        }
        .admin-panel .panel-header h3 i {
            color: var(--gold);
            margin-right: 8px;
        }
        .admin-panel .panel-close {
            background: none;
            color: var(--text-secondary);
            font-size: 24px;
        }
        .admin-panel .panel-close:hover {
            color: var(--text-primary);
        }
        .admin-panel .deposit-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }
        .admin-panel .deposit-item .deposit-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .admin-panel .deposit-item .deposit-info .user {
            font-weight: 600;
        }
        .admin-panel .deposit-item .deposit-info .amount {
            color: var(--gold);
            font-weight: 700;
        }
        .admin-panel .deposit-item .deposit-info .status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .admin-panel .deposit-item .deposit-info .status.pending {
            background: #f39c12;
            color: #0b0b1a;
        }
        .admin-panel .deposit-item .deposit-info .status.approved {
            background: #27ae60;
            color: #fff;
        }
        .admin-panel .deposit-item .deposit-info .status.rejected {
            background: #e74c3c;
            color: #fff;
        }
        .admin-panel .deposit-item .deposit-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .admin-panel .deposit-item .receipt-preview {
            max-width: 100%;
            max-height: 120px;
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid var(--border-color);
            object-fit: cover;
        }
        .admin-panel .deposit-item .bank-details-mini {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            padding: 6px 10px;
            background: var(--bg-primary);
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-panel .deposit-item .bank-details-mini span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .admin-panel .deposit-item .bank-details-mini i {
            color: var(--gold);
            font-size: 11px;
        }
        .admin-panel .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
        }
        .admin-panel .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 12px;
        }
        .admin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .admin-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 480px;
            width: 90%;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .modal-overlay.open .modal {
            transform: scale(1);
        }
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal .modal-header h3 {
            font-size: 20px;
        }
        .modal .modal-close {
            background: none;
            color: var(--text-secondary);
            font-size: 22px;
        }
        .modal .modal-close:hover {
            color: var(--text-primary);
        }

        /* ---------- TOAST ---------- */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            background: var(--toast-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            box-shadow: var(--shadow);
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.success {
            border-color: #27ae60;
        }
        .toast.success i {

                if (isReferralCodeTaken(code)) throw new Error(&#39;This referral code is already taken. Please choose another.&#39;);
                finalCustomCode = code;
            } else {
                // generate a random one if not provided
                let generated;
                let attempts = 0;
                do {
                    generated = generateReferralCode();
                    attempts++;
                } while (isReferralCodeTaken(generated) &amp;&amp; attempts &lt; 50);
                finalCustomCode = generated;
            }

            let referredBy = null;
            let referrer = null;
            if (referrerCode) {
                referrer = findUserByReferralCode(referrerCode);
                if (referrer) {
                    referredBy = referrer.id;
                } else {
                    throw new Error(&#39;Invalid referral code&#39;);
                }
            }

            const user = {
                id: generateId(),
                fullName: fullName.trim(),
                email: email.trim().toLowerCase(),
                phone: phone.trim(),
                password: hashPassword(password),
                balance: 0,
                totalInvested: 0,
                totalReturns: 0,
                referralCode: generateReferralCode(), // legacy fallback
                customReferralCode: finalCustomCode,
                referredBy: referredBy,
                referrals: [],
                referralBonus: 0,
                firstDepositDone: false,
                createdAt: new Date().toISOString(),
            };

            if (referrer) {
                const referralEntry = {
                    userId: user.id,
                    status: &#39;pending&#39;,
                    joinedAt: new Date().toISOString(),
                };
                referrer.referrals.push(referralEntry);
                const idx = state.users.findIndex(u =&gt; u.id === referrer.id);
                if (idx !== -1) state.users[idx] = referrer;
            }

            state.users.push(user);
            await saveAllData();
            return user;
        }

        async function loginUser(email, password) {
            const user = findUserByEmail(email);
            if (!user) throw new Error(&#39;Email not found&#39;);
            if (!verifyPassword(password, user.password)) throw new Error(&#39;Incorrect password&#39;);
            return user;
        }

        //  DEPOSITS
        // ============================================================
        async function createDeposit(userId, amount, bankName, accountNumber, accountName, receiptBase64) {
            if (!amount || amount &lt; 100) throw new Error(&#39;Minimum deposit is ₦100&#39;);
            const deposit = {
                id: generateId(),
                userId,
                amount: Number(amount),
                bankName: bankName.trim(),
                accountNumber: accountNumber.trim(),
                accountName: accountName.trim(),
                status: &#39;pending&#39;,
                receipt: receiptBase64 || &#39;&#39;,
                createdAt: new Date().toISOString(),
                approvedAt: null,
            };
            state.deposits.push(deposit);
            await saveAllData();
            return deposit;
        }

        async function approveDeposit(depositId) {
            const deposit = state.deposits.find(d =&gt; d.id === depositId);
            if (!deposit) throw new Error(&#39;Deposit not found&#39;);
            if (deposit.status !== &#39;pending&#39;) throw new Error(&#39;Deposit already processed&#39;);

            deposit.status = &#39;approved&#39;;
            deposit.approvedAt = new Date().toISOString();

            const user = findUserById(deposit.userId);
            if (!user) throw new Error(&#39;User not found&#39;);

            user.balance = (user.balance || 0) + deposit.amount;

            if (!user.firstDepositDone) {
                user.firstDepositDone = true;
                user.balance += CONFIG.REFERRAL_BONUS_AMOUNT;
                user.referralBonus = (user.referralBonus || 0) + CONFIG.REFERRAL_BONUS_AMOUNT;
                showToast(`🎉 You got ₦${CONFIG.REFERRAL_BONUS_AMOUNT} first deposit bonus!`, &#39;success&#39;);

                if (user.referredBy) {
                    const referrer = findUserById(user.referredBy);
                    if (referrer) {
                        const refEntry = referrer.referrals.find(r =&gt; r.userId === user.id);
                        if (refEntry &amp;&amp; refEntry.status === &#39;pending&#39;) {
                            refEntry.status = &#39;active&#39;;
                            refEntry.depositedAt = new Date().toISOString();
                        }
                        referrer.balance = (referrer.balance || 0) + CONFIG.REFERRAL_BONUS_AMOUNT;
                        referrer.referralBonus = (referrer.referralBonus || 0) + CONFIG.REFERRAL_BONUS_AMOUNT;
                        showToast(`Referrer ${referrer.fullName} got ₦${CONFIG.REFERRAL_BONUS_AMOUNT} bonus!`, &#39;success&#39;);
                        const idx = state.users.findIndex(u =&gt; u.id === referrer.id);
                        if (idx !== -1) state.users[idx] = referrer;
                    }
                }
            }

            await saveAllData();
            return deposit;
        }

        async function rejectDeposit(depositId) {
            const deposit = state.deposits.find(d =&gt; d.id === depositId);
            if (!deposit) throw new Error(&#39;Deposit not found&#39;);
            if (deposit.status !== &#39;pending&#39;) throw new Error(&#39;Deposit already processed&#39;);
            deposit.status = &#39;rejected&#39;;
            await saveAllData();
            return deposit;
        }

        // ============================================================
        //  INVESTMENTS
        // ============================================================
        async function createInvestment(userId, planId) {
            const user = findUserById(userId);
            if (!user) throw new Error(&#39;User not found&#39;);
            const plan = PLANS.find(p =&gt; p.id === planId);
            if (!plan) throw new Error(&#39;Invalid plan&#39;);

            const amount = plan.amount;
            if (amount &gt; user.balance) {
                throw new Error(`Insufficient balance. You need ${formatCurrency(amount)} but have ${formatCurrency(user.balance)}`);
            }

            user.balance = (user.balance || 0) - amount;
            user.totalInvested = (user.totalInvested || 0) + amount;

            const investment = {
                id: generateId(),
                userId,
                planId,
                amount: Number(amount),
                startDate: new Date().toISOString(),
                endDate: new Date(Date.now() + plan.duration * 24 * 60 * 60 * 1000).toISOString(),
                rate: plan.rate,
                status: &#39;active&#39;,
                returns: 0,
                createdAt: new Date().toISOString(),
            };

            state.investments.push(investment);
            await saveAllData();
            return investment;
        }

        // ============================================================
        //  WITHDRAWALS
        // ============================================================
        async function createWithdrawal(userId, amount, bankName, accountNumber, accountName) {
            const user = findUserById(userId);
            if (!user) throw new Error(&#39;User not found&#39;);

            const activeReferrals = user.referrals ? user.referrals.filter(r =&gt; r.status === &#39;active&#39;) : [];
            if (activeReferrals.length === 0) {
                throw new Error(&#39;You need at least one active referral (someone who has deposited) to withdraw. Share your referral code!&#39;);
            }

            if (amount &gt; CONFIG.WITHDRAW_LIMIT) {
                throw new Error(`Maximum withdrawal is ${formatCurrency(CONFIG.WITHDRAW_LIMIT)}`);
            }
            if (amount &lt; 100) throw new Error(&#39;Minimum withdrawal is ₦100&#39;);
            if (amount &gt; user.balance) throw new Error(&#39;Insufficient balance&#39;);

            const withdrawal = {
                id: generateId(),
                userId,
                amount: Number(amount),
                bankName: bankName.trim(),
                accountNumber: accountNumber.trim(),
                accountName: accountName.trim(),
                status: &#39;pending&#39;,
                createdAt: new Date().toISOString(),
                processedAt: null,
            };
            state.withdrawals.push(withdrawal);

            user.balance = (user.balance || 0) - amount;

            await saveAllData();
            return withdrawal;
        }

        async function processWithdrawal(withdrawalId, action) {
            const withdrawal = state.withdrawals.find(w =&gt; w.id === withdrawalId);
            if (!withdrawal) throw new Error(&#39;Withdrawal not found&#39;);
            if (withdrawal.status !== &#39;pending&#39;) throw new Error(&#39;Withdrawal already processed&#39;);

            if (action === &#39;approve&#39;) {
                withdrawal.status = &#39;approved&#39;;
                withdrawal.processedAt = new Date().toISOString();
            } else if (action === &#39;reject&#39;) {
                withdrawal.status = &#39;rejected&#39;;
                withdrawal.processedAt = new Date().toISOString();
                const user = findUserById(withdrawal.userId);
                if (user) {
                    user.balance = (user.balance || 0) + withdrawal.amount;
                }
            }
            await saveAllData();
            return withdrawal;
        }

        async function setCustomReferralCode(userId, newCode) {
            const user = findUserById(userId);

            const code = newCode.toUpperCase().trim();

            if (!/^[a-zA-Z0-9]+$/.test(code)) throw new Error(&#39;Referral code can only contain letters and numbers.&#39;);
            if (isReferralCodeTaken(code, userId)) throw new Error(&#39;This referral code is already taken. Please choose another.&#39;);

            user.customReferralCode = code;

        function shareReferral() {
            const u = state.currentUser;
            if (!u) return;
            const code = u.customReferralCode || u.referralCode;
            const link = `${window.location.origin}${window.location.pathname}?ref=${code}`;
            const message =
                `🚀 Invest in Oil &amp; Gas with Petroflow! Use my referral link to get started and earn a ₦${CONFIG.REFERRAL_BONUS_AMOUNT} bonus on your first deposit. Join now: ${link}`;

            if (navigator.share) {
                navigator.share({
                    title: &#39;Petroflow - Invest in Oil &amp; Gas&#39;,
                    text: message,
                    url: link,
                }).catch(() =&gt; {});
            } else {
                navigator.clipboard.writeText(message).then(() =&gt; {
                    showToast(&#39;Referral link with message copied to clipboard!&#39;, &#39;success&#39;);
                }).catch(() =&gt; {
                    const textarea = document.createElement(&#39;textarea&#39;);
                    textarea.value = message;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand(&#39;copy&#39;);
                    textarea.remove();
                    showToast(&#39;Referral link with message copied!&#39;, &#39;success&#39;);
                });
            }
        }

        // ============================================================
        //  INVESTMENT RETURNS
        // ============================================================
        function calculateReturns() {
            const now = Date.now();
            let updated = false;

            state.investments.forEach(inv =&gt; {
                if (inv.status !== &#39;active&#39;) return;
                const start = new Date(inv.startDate).getTime();
                const end = new Date(inv.endDate).getTime();
                if (now &gt;= end) {
                    inv.status = &#39;completed&#39;;
                    const totalReturn = inv.amount * (inv.rate / 100);
                    inv.returns = totalReturn;
                    const user = findUserById(inv.userId);
                    if (user) {
                        user.balance = (user.balance || 0) + totalReturn;
                        user.totalReturns = (user.totalReturns || 0) + totalReturn;
                    }
                    updated = true;
                } else {
                    const elapsed = now - start;
                    const totalDuration = end - start;
                    const progress = elapsed / totalDuration;
                    const expectedReturn = inv.amount * (inv.rate / 100) * progress;
                    if (expectedReturn - inv.returns &gt; 0.01) {
                        inv.returns = expectedReturn;
                        updated = true;
                    }
                }
            });

            if (updated) {
                saveAllData().catch(console.error);
            }
        }

        function getPreferredTheme() {
            const stored = localStorage.getItem(&#39;petroflow_theme&#39;);
            if (stored) return stored;
            if (window.matchMedia &amp;&amp; window.matchMedia(&#39;(prefers-color-scheme: light)&#39;).matches) {
                return &#39;light&#39;;
            }
            return &#39;dark&#39;;
        }

        function setTheme(theme) {
            document.documentElement.setAttribute(&#39;data-theme&#39;, theme);
            localStorage.setItem(&#39;petroflow_theme&#39;, theme);
            const icon = document.getElementById(&#39;themeIcon&#39;);
            if (theme === &#39;light&#39;) {
                icon.className = &#39;fas fa-sun&#39;;
            } else {
                icon.className = &#39;fas fa-moon&#39;;
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute(&#39;data-theme&#39;) || &#39;dark&#39;;
            const next = current === &#39;dark&#39; ? &#39;light&#39; : &#39;dark&#39;;
            setTheme(next);
        }

                    &lt;span style=&#34;font-size:11px;color:var(--text-muted);&#34;&gt;If someone referred you, enter their code to earn them a bonus.&lt;/span&gt;
                  &lt;/div&gt;
                  &lt;button type=&#34;submit&#34; class=&#34;btn btn-gold btn-block&#34; id=&#34;registerBtn&#34;&gt;Create Account&lt;/button&gt;
                &lt;/form&gt;
                &lt;p class=&#34;text-center mt-2 text-muted&#34; style=&#34;font-size:14px;&#34;&gt;Already have an account? &lt;a href=&#34;#&#34; data-view=&#34;login&#34;&gt;Login&lt;/a&gt;&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          `;
        }

        // ============================================================
        //  DASHBOARD
        // ============================================================
        function renderDashboard() {
            const u = state.currentUser;
            if (!u) return renderHome();

            const userInvestments = state.investments.filter(inv =&gt; inv.userId === u.id);
            const activeInvestments = userInvestments.filter(inv =&gt; inv.status === &#39;active&#39;);
            const completedInvestments = userInvestments.filter(inv =&gt; inv.status === &#39;completed&#39;);
            const pendingDeposits = state.deposits.filter(d =&gt; d.userId === u.id &amp;&amp; d.status === &#39;pending&#39;);
            const recentDeposits = state.deposits.filter(d =&gt; d.userId === u.id).slice(0, 3);
            const recentWithdrawals = state.withdrawals.filter(w =&gt; w.userId === u.id).slice(0, 3);

            const totalReturns = userInvestments
                .filter(inv =&gt; inv.status === &#39;completed&#39;)
                .reduce((sum, inv) =&gt; sum + (inv.returns || 0), 0);
            const pendingReturns = activeInvestments.reduce((sum, inv) =&gt; sum + (inv.returns || 0), 0);

            const referralCount = u.referrals ? u.referrals.length : 0;
            const activeReferralCount = u.referrals ? u.referrals.filter(r =&gt; r.status === &#39;active&#39;).length : 0;

            return `
            &lt;div class=&#34;fade-in&#34;&gt;
              &lt;div class=&#34;flex-between&#34; style=&#34;flex-wrap:wrap;gap:12px;margin-bottom:20px;&#34;&gt;
                &lt;div&gt;
                  &lt;h2&gt;Welcome back, ${u.fullName}&lt;/h2&gt;
                  &lt;p style=&#34;color:var(--text-secondary);font-size:14px;&#34;&gt;${formatDate(u.createdAt)} • ${u.email}&lt;/p&gt;
                &lt;/div&gt;
                &lt;div style=&#34;display:flex;gap:10px;flex-wrap:wrap;&#34;&gt;
                  &lt;a href=&#34;#&#34; data-view=&#34;deposit&#34; class=&#34;btn btn-gold btn-sm&#34;&gt;&lt;i class=&#34;fas fa-plus-circle&#34;&gt;&lt;/i&gt; Deposit&lt;/a&gt;
                  &lt;a href=&#34;#&#34; data-view=&#34;withdraw&#34; class=&#34;btn btn-outline btn-sm&#34;&gt;&lt;i class=&#34;fas fa-arrow-up&#34;&gt;&lt;/i&gt; Withdraw&lt;/a&gt;
                  &lt;a href=&#34;#&#34; data-view=&#34;plans&#34; class=&#34;btn btn-outline btn-sm&#34;&gt;&lt;i class=&#34;fas fa-chart-line&#34;&gt;&lt;/i&gt; Plans&lt;/a&gt;
                  &lt;a href=&#34;#&#34; id=&#34;logoutDashBtn&#34; class=&#34;btn btn-sm dashboard-logout-btn&#34;&gt;&lt;i class=&#34;fas fa-sign-out-alt&#34;&gt;&lt;/i&gt; Logout&lt;/a&gt;
                &lt;/div&gt;
              &lt;/div&gt;

              &lt;div class=&#34;stat-grid&#34;&gt;
                &lt;div class=&#34;stat-card&#34;&gt;
                  &lt;div class=&#34;flex-between&#34;&gt;
                    &lt;div&gt;
                      &lt;div class=&#34;stat-label&#34;&gt;Balance&lt;/div&gt;
                      &lt;div class=&#34;stat-value gold&#34;&gt;${formatCurrency(u.balance || 0)}&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;i class=&#34;fas fa-wallet stat-icon&#34;&gt;&lt;/i&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&#34;stat-card&#34;&gt;
                  &lt;div class=&#34;flex-between&#34;&gt;
                    &lt;div&gt;
                      &lt;div class=&#34;stat-label&#34;&gt;Total Invested&lt;/div&gt;
                      &lt;div class=&#34;stat-value&#34;&gt;${formatCurrency(u.totalInvested || 0)}&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;i class=&#34;fas fa-coins stat-icon&#34;&gt;&lt;/i&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&#34;stat-card&#34;&gt;
                  &lt;div class=&#34;flex-between&#34;&gt;
                    &lt;div&gt;
                      &lt;div class=&#34;stat-label&#34;&gt;Total Returns&lt;/div&gt;
                      &lt;div class=&#34;stat-value gold&#34;&gt;${formatCurrency(totalReturns + pendingReturns)}&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;i class=&#34;fas fa-chart-line stat-icon&#34;&gt;&lt;/i&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&#34;stat-card&#34;&gt;
                  &lt;div class=&#34;flex-between&#34;&gt;
                    &lt;div&gt;
                      &lt;div class=&#34;stat-label&#34;&gt;Active Investments&lt;/div&gt;
                      &lt;div class=&#34;stat-value&#34;&gt;${activeInvestments.length}&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;i class=&#34;fas fa-rocket stat-icon&#34;&gt;&lt;/i&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;

              &lt;!-- Referral Section --&gt;
              &lt;div class=&#34;card&#34; style=&#34;margin-bottom:20px;border-color:var(--gold);&#34;&gt;
                &lt;div style=&#34;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;&#34;&gt;
                  &lt;div&gt;
                    &lt;h4 style=&#34;font-size:16px;&#34;&gt;&lt;i class=&#34;fas fa-gift text-gold&#34;&gt;&lt;/i&gt; Refer &amp; Earn&lt;/h4&gt;
                    &lt;p style=&#34;font-size:13px;color:var(--text-muted);&#34;&gt;Share your code and earn &lt;strong class=&#34;text-gold&#34;&gt;₦${CONFIG.REFERRAL_BONUS_AMOUNT}&lt;/strong&gt; when they make their first deposit.&lt;/p&gt;
                  &lt;/div&gt;
                  &lt;div class=&#34;referral-stats&#34;&gt;
                    &lt;span&gt;👥 &lt;strong&gt;${referralCount}&lt;/strong&gt; referral${referralCount !== 1 ? &#39;s&#39; : &#39;&#39;}&lt;/span&gt;
                    &lt;span&gt;✅ &lt;strong&gt;${activeReferralCount}&lt;/strong&gt; active&lt;/span&gt;
                    &lt;span&gt;💰 &lt;strong&gt;${formatCurrency(u.referralBonus || 0)}&lt;/strong&gt; bonus earned&lt;/span&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&#34;referral-box&#34; style=&#34;margin-top:12px;&#34;&gt;
                  &lt;span class=&#34;code&#34;&gt;${u.customReferralCode || u.referralCode}&lt;/span&gt;
                  &lt;div style=&#34;display:flex;gap:8px;flex-wrap:wrap;&#34;&gt;
                    &lt;button class=&#34;copy-btn&#34; id=&#34;copyReferralBtn&#34;&gt;&lt;i class=&#34;fas fa-copy&#34;&gt;&lt;/i&gt; Copy Code&lt;/button&gt;
                    &lt;button class=&#34;copy-btn&#34; id=&#34;copyReferralLinkBtn&#34;&gt;&lt;i class=&#34;fas fa-link&#34;&gt;&lt;/i&gt; Copy Link&lt;/button&gt;
                    &lt;button class=&#34;share-btn&#34; id=&#34;shareReferralBtn&#34;&gt;&lt;i class=&#34;fas fa-share-alt&#34;&gt;&lt;/i&gt; Share&lt;/button&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
              &lt;/div&gt;

              ${pendingDeposits.length &gt; 0 ? `
                &lt;div class=&#34;card&#34; style=&#34;border-color:#f39c12;margin-bottom:20px;&#34;&gt;
                  &lt;div style=&#34;display:flex;align-items:center;gap:12px;&#34;&gt;
                    &lt;i class=&#34;fas fa-clock&#34; style=&#34;color:#f39c12;font-size:20px;&#34;&gt;&lt;/i&gt;
                    &lt;span&gt;You have &lt;strong&gt;${pendingDeposits.length}&lt;/strong&gt; deposit(s) pending approval.&lt;/span&gt;
                  &lt;/div&gt;
                &lt;/div&gt;
              ` : &#39;&#39;}

              &lt;div class=&#34;grid-2&#34;&gt;
                &lt;div&gt;
                  &lt;h3 style=&#34;font-size:18px;margin-bottom:14px;&#34;&gt;&lt;i class=&#34;fas fa-chart-pie text-gold&#34;&gt;&lt;/i&gt; Active Investments&lt;/h3&gt;
                  ${activeInvestments.length === 0 ? `
                    &lt;div class=&#34;card&#34; style=&#34;text-align:center;padding:30px;color:var(--text-muted);&#34;&gt;
                      &lt;i class=&#34;fas fa-inbox&#34; style=&#34;font-size:32px;opacity:0.3;margin-bottom:10px;&#34;&gt;&lt;/i&gt;
                      &lt;p&gt;No active investments. &lt;a href=&#34;#&#34; data-view=&#34;plans&#34;&gt;View plans&lt;/a&gt;&lt;/p&gt;
                    &lt;/div&gt;
                  ` : `
                    ${activeInvestments.map(inv =&gt; {
                      const plan = PLANS.find(p =&gt; p.id === inv.planId);
                      const progress = Math.min(100, ((Date.now() - new Date(inv.startDate).getTime()) / (new Date(inv.endDate).getTime() - new Date(inv.startDate).getTime())) * 100);
                      const expectedReturn = inv.amount * (inv.rate / 100);
                      return `
                        &lt;div class=&#34;card&#34; style=&#34;margin-bottom:12px;&#34;&gt;
                          &lt;div class=&#34;flex-between&#34;&gt;
                            &lt;div&gt;
                              &lt;strong&gt;${plan ? plan.name : &#39;Unknown Plan&#39;}&lt;/strong&gt;
                              &lt;span class=&#34;pill gold&#34; style=&#34;margin-left:8px;&#34;&gt;${inv.rate}%&lt;/span&gt;
                            &lt;/div&gt;
                            &lt;span&gt;${formatCurrency(inv.amount)}&lt;/span&gt;
                          &lt;/div&gt;
                          &lt;div style=&#34;margin-top:8px;&#34;&gt;
                            &lt;div style=&#34;display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);&#34;&gt;
                              &lt;span&gt;Progress&lt;/span&gt;
                              &lt;span&gt;${Math.round(progress)}%&lt;/span&gt;
                            &lt;/div&gt;
                            &lt;div style=&#34;height:4px;background:var(--bg-secondary);border-radius:4px;overflow:hidden;margin-top:2px;&#34;&gt;
                              &lt;div style=&#34;height:100%;width:${Math.min(100, progress)}%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:4px;&#34;&gt;&lt;/div&gt;
                            &lt;/div&gt;
                          &lt;/div&gt;
                          &lt;div style=&#34;display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:6px;&#34;&gt;
                            &lt;span&gt;Start: ${formatDate(inv.startDate)}&lt;/span&gt;
                            &lt;span&gt;End: ${formatDate(inv.endDate)}&lt;/span&gt;
                          &lt;/div&gt;
                          &lt;div style=&#34;margin-top:6px;font-size:13px;color:var(--gold);&#34;&gt;
                            Est. return: ${formatCurrency(expectedReturn)}
                            ${inv.returns &gt; 0 ? ` (accrued: ${formatCurrency(inv.returns)})` : &#39;&#39;}
                          &lt;/div&gt;
                        &lt;/div&gt;
                      `;
                    }).join(&#39;&#39;)}
                  `}
                &lt;/div&gt;
                &lt;div&gt;
                  &lt;h3 style=&#34;font-size:18px;margin-bottom:14px;&#34;&gt;&lt;i class=&#34;fas fa-clock text-gold&#34;&gt;&lt;/i&gt; Recent Activity&lt;/h3&gt;
                  ${recentDeposits.length === 0 &amp;&amp; recentWithdrawals.length === 0 ? `
                    &lt;div class=&#34;card&#34; style=&#34;text-align:center;padding:30px;color:var(--text-muted);&#34;&gt;
                      &lt;i class=&#34;fas fa-history&#34; style=&#34;font-size:32px;opacity:0.3;margin-bottom:10px;&#34;&gt;&lt;/i&gt;
                      &lt;p&gt;No recent activity&lt;/p&gt;
                    &lt;/div&gt;
                  ` : `
                    ${recentDeposits.map(d =&gt; `
                      &lt;div class=&#34;card&#34; style=&#34;margin-bottom:8px;padding:14px 16px;&#34;&gt;
                        &lt;div class=&#34;flex-between&#34;&gt;
                          &lt;span&gt;&lt;i class=&#34;fas fa-arrow-down&#34; style=&#34;color:#27ae60;&#34;&gt;&lt;/i&gt; Deposit&lt;/span&gt;
                          &lt;span&gt;${formatCurrency(d.amount)}&lt;/span&gt;
                        &lt;/div&gt;
                        &lt;div style=&#34;display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);&#34;&gt;
                          &lt;span&gt;${formatDate(d.createdAt)}&lt;/span&gt;
                          &lt;span class=&#34;pill ${d.status === &#39;pending&#39; ? &#39;yellow&#39; : d.status === &#39;approved&#39; ? &#39;green&#39; : &#39;red&#39;}&#34;&gt;${d.status}&lt;/span&gt;
                        &lt;/div&gt;
                      &lt;/div&gt;
                    `).join(&#39;&#39;)}
                    ${recentWithdrawals.map(w =&gt; `
                      &lt;div class=&#34;card&#34; style=&#34;margin-bottom:8px;padding:14px 16px;&#34;&gt;
                        &lt;div class=&#34;flex-between&#34;&gt;
                          &lt;span&gt;&lt;i class=&#34;fas fa-arrow-up&#34; style=&#34;color:#e74c3c;&#34;&gt;&lt;/i&gt; Withdrawal&lt;/span&gt;
                          &lt;span&gt;${formatCurrency(w.amount)}&lt;/span&gt;
                        &lt;/div&gt;
                        &lt;div style=&#34;display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);&#34;&gt;
                          &lt;span&gt;${formatDate(w.createdAt)}&lt;/span&gt;
                          &lt;span class=&#34;pill ${w.status === &#39;pending&#39; ? &#39;yellow&#39; : w.status === &#39;approved&#39; ? &#39;green&#39; : &#39;red&#39;}&#34;&gt;${w.status}&lt;/span&gt;
                        &lt;/div&gt;
                      &lt;/div&gt;
                    `).join(&#39;&#39;)}
                  `}
                &lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          `;
        }

        // ============================================================
        //  PLANS
        // ============================================================
        function renderPlans() {
            const isLoggedIn = !!state.currentUser;
            const backTarget = isLoggedIn ? &#39;dashboard&#39; : &#39;home&#39;;
            return `
            &lt;div class=&#34;fade-in&#34;&gt;
              &lt;div class=&#34;page-header&#34;&gt;
                &lt;button class=&#34;back-btn&#34; data-view=&#34;${backTarget}&#34;&gt;&lt;i class=&#34;fas fa-arrow-left&#34;&gt;&lt;/i&gt; Back&lt;/button&gt;
                &lt;h2&gt;Investment Plans&lt;/h2&gt;
              &lt;/div&gt;
              &lt;p class=&#34;text-muted&#34; style=&#34;margin-bottom:30px;&#34;&gt;Choose a fixed-amount plan that fits your investment goals. &lt;strong class=&#34;text-gold&#34;&gt;High-yield returns&lt;/strong&gt; designed for growth.&lt;/p&gt;
              &lt;div class=&#34;grid-3&#34;&gt;
                ${PLANS.map(p =&gt; `
                  &lt;div class=&#34;plan-card&#34;&gt;
                    &lt;div class=&#34;plan-badge&#34;&gt;${p.rate}%&lt;/div&gt;
                    &lt;div class=&#34;plan-name&#34;&gt;${p.name}&lt;/div&gt;
                    &lt;div class=&#34;plan-rate&#34;&gt;${p.rate}% &lt;small&gt;return&lt;/small&gt;&lt;/div&gt;
                    &lt;div class=&#34;plan-fixed-amount&#34;&gt;${formatCurrency(p.amount)} &lt;small&gt;fixed investment&lt;/small&gt;&lt;/div&gt;
                    &lt;div class=&#34;plan-desc&#34;&gt;${p.desc}&lt;/div&gt;
                    &lt;ul class=&#34;plan-features&#34;&gt;
                      ${p.features.map(f =&gt; `&lt;li&gt;&lt;i class=&#34;fas fa-check-circle&#34;&gt;&lt;/i&gt; ${f}&lt;/li&gt;`).join(&#39;&#39;)}
                    &lt;/ul&gt;
                    &lt;a href=&#34;#&#34; data-view=&#34;${isLoggedIn ? &#39;invest&#39; : &#39;register&#39;}&#34; data-plan=&#34;${p.id}&#34; class=&#34;btn btn-gold btn-block btn-sm&#34;&gt;${isLoggedIn ? &#39;Invest Now&#39; : &#39;Register to Invest&#39;}&lt;/a&gt;
                  &lt;/div&gt;
                `).join(&#39;&#39;)}
              &lt;/div&gt;
            &lt;/div&gt;
          `;
        }

        // ============================================================
        //  DEPOSIT
        // ============================================================
        function renderDeposit() {
            if (!state.currentUser) return renderLogin();
            return `
            &lt;div class=&#34;fade-in&#34; style=&#34;max-width:580px;margin:20px auto;&#34;&gt;
              &lt;div class=&#34;card card-gold&#34;&gt;
                &lt;div class=&#34;page-header&#34; style=&#34;margin-bottom:12px;&#34;&gt;
                  &lt;button class=&#34;back-btn&#34; data-view=&#34;dashboard&#34;&gt;&lt;i class=&#34;fas fa-arrow-left&#34;&gt;&lt;/i&gt; Back&lt;/button&gt;
                  &lt;h2 style=&#34;font-size:20px;margin:0;&#34;&gt;&lt;i class=&#34;fas fa-arrow-down text-gold&#34;&gt;&lt;/i&gt; Make a Deposit&lt;/h2&gt;
                &lt;/div&gt;
                &lt;p style=&#34;color:var(--text-secondary);font-size:14px;margin-bottom:16px;&#34;&gt;Fund your wallet in Naira. Minimum deposit: ₦100&lt;/p&gt;

                &lt;div class=&#34;bank-details&#34;&gt;
                  &lt;div class=&#34;row&#34;&gt;&lt;span class=&#34;label&#34;&gt;Bank&lt;/span&gt;&lt;span class=&#34;value&#34;&gt;${CONFIG.BANK_NAME}&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&#34;row&#34;&gt;&lt;span class=&#34;label&#34;&gt;Account Number&lt;/span&gt;&lt;span class=&#34;value gold&#34; style=&#34;font-size:20px;letter-spacing:1px;&#34;&gt;${CONFIG.BANK_ACCOUNT}&lt;/span&gt;&lt;/div&gt;
                  &lt;div class=&#34;row&#34;&gt;&lt;span class=&#34;label&#34;&gt;Account Name&lt;/span&gt;&lt;span class=&#34;value&#34;&gt;${CONFIG.BANK_ACCOUNT_NAME}&lt;/span&gt;&lt;/div&gt;
                  &lt;button class=&#34;copy-btn&#34; id=&#34;copyAccountBtn&#34; style=&#34;margin-top:6px;font-size:12px;&#34;&gt;&lt;i class=&#34;fas fa-copy&#34;&gt;&lt;/i&gt; Copy Account Number&lt;/button&gt;
                &lt;/div&gt;

                &lt;form id=&#34;depositForm&#34;&gt;
                  &lt;div class=&#34;form-group&#34;&gt;
                    &lt;label&gt;Amount (₦)&lt;/label&gt;
                    &lt;input type=&#34;number&#34; id=&#34;depositAmount&#34; placeholder=&#34;Enter amount&#34; min=&#34;100&#34; step=&#34;1&#34; required /&gt;
                    &lt;span style=&#34;font-size:12px;color:var(--text-muted);&#34;&gt;Min: ₦100&lt;/span&gt;
                  &lt;/div&gt;
                  &lt;div class=&#34;form-group&#34;&gt;
                    &lt;label&gt;Your Bank Name&lt;/label&gt;
                    &lt;input type=&#34;text&#34; id=&#34;depositBankName&#34; placeholder=&#34;e.g. GTBank&#34; required /&gt;
                  &lt;/div&gt;
                  &lt;div class=&#34;form-group&#34;&gt;
                    &lt;label&gt;Your Account Number&lt;/label&gt;
                    &lt;input type=&#34;text&#34; id=&#34;depositAccountNumber&#34; placeholder=&#34;Enter your account number&#34; required /&gt;
                  &lt;/div&gt;
                  &lt;div class=&#34;form-group&#34;&gt;
                    &lt;label&gt;Your Account Name&lt;/label&gt;
                    &lt;input type=&#34;text&#34; id=&#34;depositAccountName&#34; placeholder=&#34;Enter your account holder name&#34; required /&gt;
                  &lt;/div&gt;
                  &lt;div class=&#34;form-group&#34;&gt;
                    &lt;label&gt;Upload Payment Receipt&lt;/label&gt;
                    &lt;div class=&#34;file-input&#34; id=&#34;receiptDrop&#34;&gt;
                      &lt;i class=&#34;fas fa-cloud-upload-alt&#34; style=&#34;font-size:28px;color:var(--gold);&#34;&gt;&lt;/i&gt;
                      &lt;p&gt;Click or drag to upload receipt&lt;/p&gt;
                      &lt;div class=&#34;file-name&#34; id=&#34;receiptFileName&#34;&gt;No file selected&lt;/div&gt;
                      &lt;input type=&#34;file&#34; id=&#34;receiptFile&#34; accept=&#34;image/*&#34; /&gt;
                    &lt;/div&gt;
                  &lt;/div&gt;
                  &lt;button type=&#34;submit&#34; class=&#34;btn btn-gold btn-block&#34; id=&#34;depositBtn&#34;&gt;Submit Deposit&lt;/button&gt;
                &lt;/form&gt;
                &lt;p style=&#34;font-size:12px;color:var(--text-muted);text-align:center;margin-top:12px;&#34;&gt;
                  &lt;i class=&#34;fas fa-info-circle&#34;&gt;&lt;/i&gt; Deposits are manually verified within 24 hours.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          `;
        }

        // ============================================================
        //  WITHDRAW
        // ============================================================
        function renderWithdraw() {
            if (!state.currentUser) return renderLogin();
            const u = state.currentUser;
            const activeReferrals = u.referrals ? u.referrals.filter(r =&gt; r.status === &#39;active&#39;) : [];
            const hasActiveReferral = activeReferrals.length &gt; 0;

            return `
            &lt;div class=&#34;fade-in&#34; style=&#34;max-width:480px;margin:20px auto;&#34;&gt;
              &lt;div class=&#34;card card-gold&#34;&gt;
                &lt;div class=&#34;page-header&#34; style=&#34;margin-bottom:12px;&#34;&gt;
                  &lt;button class=&#34;back-btn&#34; data-view=&#34;dashboard&#34;&gt;&lt;i class=&#34;fas fa-arrow-left&#34;&gt;&lt;/i&gt; Back&lt;/button&gt;
                  &lt;h2 style=&#34;font-size:20px;margin:0;&#34;&gt;&lt;i class=&#34;fas fa-arrow-up text-gold&#34;&gt;&lt;/i&gt; Withdraw Funds&lt;/h2&gt;
                &lt;/div&gt;
                &lt;p style=&#34;color:var(--text-secondary);font-size:14px;margin-bottom:6px;&#34;&gt;Available balance: &lt;strong class=&#34;text-gold&#34;&gt;${formatCurrency(u.balance || 0)}&lt;/strong&gt;&lt;/p&gt;
                &lt;p style=&#34;font-size:13px;color:var(--text-muted);margin-bottom:16px;&#34;&gt;Min: ₦100 • Max: ${formatCurrency(CONFIG.WITHDRAW_LIMIT)}&lt;/p&gt;

                ${!hasActiveReferral ? `
                  &lt;div class=&#34;withdraw-warning&#34;&gt;
                    &lt;i class=&#34;fas fa-exclamation-triangle&#34;&gt;&lt;/i&gt;

        // ============================================================
        //  INVEST
        // ============================================================

            const urlParams = new URLSearchParams(window.location.search);

            &lt;div class=&#34;fade-in&#34; style=&#34;max-width:520px;margin:20px auto;&#34;&gt;

                &lt;div class=&#34;page-header&#34; style=&#34;margin-bottom:12px;&#34;&gt;
                  &lt;button class=&#34;back-btn&#34; data-view=&#34;plans&#34;&gt;&lt;i class=&#34;fas fa-arrow-left&#34;&gt;&lt;/i&gt; Back&lt;/button&gt;
                  &lt;h2 style=&#34;font-size:20px;margin:0;&#34;&gt;&lt;i class=&#34;fas fa-chart-line text-gold&#34;&gt;&lt;/i&gt; Confirm Investment&lt;/h2&gt;
                &lt;/div&gt;
                &lt;p style=&#34;color:var(--text-secondary);font-size:14px;margin-bottom:6px;&#34;&gt;Available balance: &lt;strong class=&#34;text-gold&#34;&gt;${formatCurrency(u.balance || 0)}&lt;/strong&gt;&lt;/p&gt;

                  &lt;div class=&#34;label&#34; style=&#34;margin-top:10px;&#34;&gt;Investment Amount&lt;/div&gt;
                  &lt;div class=&#34;big-amount&#34;&gt;${formatCurrency(selectedPlan.amount)}&lt;/div&gt;
                  &lt;div style=&#34;display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:14px;color:var(--text-secondary);&#34;&gt;
                    &lt;span&gt;Rate: &lt;strong class=&#34;text-gold&#34;&gt;${selectedPlan.rate}%&lt;/strong&gt;&lt;/span&gt;
                    &lt;span&gt;Duration: &lt;strong&gt;${selectedPlan.duration} days&lt;/strong&gt;&lt;/span&gt;
                  &lt;/div&gt;
                  &lt;div style=&#34;margin-top:8px;font-size:15px;color:var(--text-primary);&#34;&gt;

                  &lt;/div&gt;
                &lt;/div&gt;

                &lt;form id=&#34;investForm&#34;&gt;
                  &lt;div class=&#34;form-group&#34;&gt;
                    &lt;label&gt;Select Plan&lt;/label&gt;
                    &lt;select id=&#34;investPlan&#34; required&gt;
                      ${PLANS.map(p =&gt; `
                        &lt;option value=&#34;${p.id}&#34; ${p.id === selectedPlan.id ? &#39;selected&#39; : &#39;&#39;}&gt;
                          ${p.name} — ${formatCurrency(p.amount)} (${p.rate}%, ${p.duration}d)

                      `).join(&#39;&#39;)}
                    &lt;/select&gt;
                  &lt;/div&gt;

                  &lt;div style=&#34;background:var(--bg-primary);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text-secondary);&#34;&gt;
                    &lt;div class=&#34;flex-between&#34;&gt;
                      &lt;span&gt;You will invest:&lt;/span&gt;
                      &lt;span class=&#34;text-gold&#34; id=&#34;investDisplayAmount&#34;&gt;${formatCurrency(selectedPlan.amount)}&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;div class=&#34;flex-between&#34;&gt;
                      &lt;span&gt;Rate:&lt;/span&gt;
                      &lt;span class=&#34;text-gold&#34; id=&#34;investDisplayRate&#34;&gt;${selectedPlan.rate}%&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;div class=&#34;flex-between&#34;&gt;
                      &lt;span&gt;Est. return:&lt;/span&gt;
                      &lt;span class=&#34;text-gold&#34; id=&#34;investDisplayReturn&#34; style=&#34;font-weight:700;&#34;&gt;${formatCurrency(selectedPlan.amount * selectedPlan.rate / 100)}&lt;/span&gt;
                    &lt;/div&gt;
                    &lt;div class=&#34;flex-between&#34;&gt;
                      &lt;span&gt;Duration:&lt;/span&gt;
                      &lt;span&gt;${selectedPlan.duration} days&lt;/span&gt;
                    &lt;/div&gt;
                  &lt;/div&gt;

                    &lt;i class=&#34;fas fa-rocket&#34;&gt;&lt;/i&gt; Invest ${formatCurrency(selectedPlan.amount)}
                  &lt;/button&gt;

                &lt;p style=&#34;font-size:12px;color:var(--text-muted);text-align:center;margin-top:12px;&#34;&gt;
